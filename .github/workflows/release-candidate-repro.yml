name: AgentOS prelicense RC technical reproduction

on:
  push:
    branches:
      - release-candidate/agentos-v0.1.0-prelicense
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned upstream overlay inputs
        run: python3 scripts/verify_split_sources.py
      - name: Validate shell entrypoints
        run: |
          bash -n scripts/reconstruct_agentos_overlay.sh
          bash -n scripts/reproduce_release_candidate.sh
          bash -n examples/world-effect-reuse/run_demo.sh
      - name: Run independent runner unit tests
        run: |
          python3 -m unittest discover -s examples/world-effect-reuse -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/resource-footprint -p 'test_*.py' -v
          python3 -m py_compile scripts/validate_release_candidate.py
          python3 -m py_compile benchmarks/wejbench/v0.1/audit_live_matrix.py

  fresh-checkout-replay:
    needs: integrity-and-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU-only QEMU dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 e2fsprogs
          qemu-system-x86_64 --version
          python3 --version
      - name: Rebuild from pinned upstream and run baseline + independent world-effect example
        env:
          RUN_QEMU_SMOKE: "0"
        run: |
          bash scripts/reproduce_release_candidate.sh "$RUNNER_TEMP/agentos-reproduction"
          python3 -m json.tool "$RUNNER_TEMP/agentos-reproduction/reproduction_summary.json" >/dev/null
          python3 - "$RUNNER_TEMP/agentos-reproduction/reproduction_summary.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data["technical_reproduction_validation"]=="PASS"
          assert data["baseline_task_count"]==6
          assert data["demo_trace_count"]==2
          assert data["independent_nonmaintainer_reproduction_claimed"] is False
          assert data["legal_release_clearance_claimed"] is False
          print("RC technical reproduction passed. Human independent study and legal license remain outstanding.")
          PY
      - name: Retain sanitized result only (not raw QEMU logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentos-rc-technical-reproduction
          path: ${{ runner.temp }}/agentos-reproduction/reproduction_summary.json
          if-no-files-found: ignore
          retention-days: 30
