name: WEJ-Bench v0.1 fixture and source verification
on:
  push:
    branches: [work/wej-bench-v0.1]
  pull_request:
    paths:
      - "benchmarks/wejbench/**"
      - ".github/workflows/wej-bench-v01.yml"
  workflow_dispatch:

concurrency:
  group: wej-bench-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  definitions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate 24-task manifest and 33 hand-authored replay steps
        run: python3 benchmarks/wejbench/v0.1/prepare.py
      - name: Run strict task-schema and oracle tests
        run: python3 -m unittest discover -s benchmarks/wejbench/v0.1 -p 'test_*.py' -v
      - name: Check scripts compile
        run: |
          python3 -m py_compile benchmarks/wejbench/v0.1/prepare.py
          python3 -m py_compile benchmarks/wejbench/v0.1/run_replay.py
          python3 -m py_compile benchmarks/wejbench/v0.1/run_live.py
          python3 -m py_compile benchmarks/wejbench/v0.1/summarize.py
      - name: Plan 216 live episodes without executing them
        run: |
          python3 benchmarks/wejbench/v0.1/run_live.py --output "$RUNNER_TEMP/model-plan"
          python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/model-plan/execution_plan.json")); assert d["planned_episodes_in_this_plan"]==216 and d["completed_episodes"]==0'
  source-materialization:
    timeout-minutes: 25
    needs: definitions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct pinned source
        run: bash scripts/reconstruct_agentos_overlay.sh "$RUNNER_TEMP/AgentOS"
      - name: Verify twelve pinned original task blobs and 12 new tasks
        run: |
          python3 benchmarks/wejbench/v0.1/prepare.py --agentos-root "$RUNNER_TEMP/AgentOS" --output "$RUNNER_TEMP/wejbench-tasks"
          python3 -m json.tool "$RUNNER_TEMP/wejbench-tasks/prepared.json" >/dev/null

      - name: Install QEMU for two deterministic task checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y qemu-system-x86 e2fsprogs
      - name: Run all twelve new tasks through deterministic QEMU and validate world effects
        run: |
          python3 benchmarks/wejbench/v0.1/run_replay.py \
            --agentos-root "$RUNNER_TEMP/AgentOS" \
            --output "$RUNNER_TEMP/wejbench-fixtures"
      - name: Archive fixture-only evaluation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wejbench-v01-fixture-summary
          path: ${{ runner.temp }}/wejbench-fixtures/fixture_validation.json
          if-no-files-found: ignore
          retention-days: 14
