name: Resource-footprint study tests

on:
  pull_request:
    paths:
      - 'benchmarks/resource-footprint/**'
      - '.github/workflows/resource-footprint-tests.yml'
  workflow_dispatch:

jobs:
  test-memory-harness:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax validation
        run: python3 -m py_compile benchmarks/resource-footprint/run_memory_sweep.py benchmarks/resource-footprint/test_memory_sweep.py
      - name: Unit tests
        run: python3 -m unittest discover -s benchmarks/resource-footprint -p 'test_*.py' -v
